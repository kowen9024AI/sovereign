name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: adapter CLI smoke
        run: |
          python -m adapters.qm adapters/qm/fixtures/valid/done-succeeded.json > /dev/null
          if python -m adapters.qm <(python -c "import json;print(json.dumps(json.load(open('adapters/qm/fixtures/invalid/url-userinfo-credential.json'))['receipt']))") > /dev/null; then
            echo "expected rejection" && exit 1
          fi
      - name: sscm offline dogfood (mock roster, no provider credentials)
        run: |
          git config user.name ci && git config user.email ci@sovereign.local
          python -m sscm.local_cli dogfood --executors mock --canonical . --base "$(git rev-parse HEAD)" --mission-id ci-mock-dogfood
          test -z "$(git branch --list 'dogfood/*')"
          test "$(git worktree list | wc -l)" = "1"
      - name: sscm offline parallel dogfood (mock roster, concurrent launcher, host fan-in, review, cleanup)
        run: |
          python -m sscm.local_cli dogfood-parallel --executors mock --canonical . --base "$(git rev-parse HEAD)" --mission-id ci-mock-parallel
          test -z "$(git branch --list 'dogfood/*')"
          test "$(git worktree list | wc -l)" = "1"
